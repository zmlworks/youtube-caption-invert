<!DOCTYPE html><html><head><meta charset="utf-8"><style>
body{margin:0}
#movie_player{position:relative;width:854px;height:480px;overflow:hidden;background:#000;z-index:0}
.html5-video-container{position:absolute;inset:0;z-index:10}
.inner-video{width:100%;height:100%;background:rgb(40,120,200)}
video{width:100%;height:100%;display:block;background:rgb(40,120,200)}
.ytp-caption-window-container{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none}
.caption-window{position:absolute;line-height:normal;z-index:41}
</style></head><body>
<div id="movie_player" class="html5-video-player">
 <div class="html5-video-container"><div class="video-stream html5-main-video inner-video"></div></div>
 <div class="ytp-caption-window-container" id="ytp-caption-window-container"></div>
</div>
<script>
// Mirrors one srv3 cue from plN7JMbadRg: two <p> with identical time/position (wp=1 ap=7), pens 3 (et=4 soft shadow) and 4 (et=3 glow),
// fc=#00BCE7 fo=254 bo=0, plus pen 1 (fo=0) zero-width-space spans.
const ZW = "\u200b";
function seg(style, text) { return `<span class="ytp-caption-segment" style="display: inline-block; white-space: pre-wrap; font-size: 60px; font-family: sans-serif; ${style}">${text}</span>`; }
function win(id, shadow) {
  const w = document.createElement("div");
  w.className = "caption-window ytp-caption-window-bottom";
  w.id = "caption-window-" + id;
  w.setAttribute("style", "touch-action: none; text-align: center; overflow: hidden; left: 50%; width: 400px; height: 80px; margin-left: -200px; bottom: 2%;");
  w.innerHTML = `<span class="captions-text" style="overflow-wrap: normal; display: block;"><span class="caption-visual-line" style="display: block;">` +
    seg("color: rgba(0, 0, 0, 0); fill: rgba(0, 0, 0, 0); background: rgba(8, 8, 8, 0);", ZW) +
    seg("color: rgb(255,255,255); background: rgba(8, 8, 8, 0.75);", ZW) +
    seg(`color: rgba(0, 188, 231, 0.996); fill: rgba(0, 188, 231, 0.996); background: rgba(8, 8, 8, 0); font-weight: bold; text-shadow: ${shadow};`, ZW + " \u2588\u2588\u2588" + ZW + " " + ZW) +
    seg("color: rgba(0, 0, 0, 0); fill: rgba(0, 0, 0, 0); background: rgba(8, 8, 8, 0);", ZW) +
    `</span></span>`;
  return w;
}
window.show = function (n) {
  const c = document.getElementById("ytp-caption-window-container"); c.textContent = "";
  c.appendChild(win("a", "rgb(0,0,0) 2px 2px 3px, rgb(0,0,0) 2px 2px 4px"));
  if (n === 2) c.appendChild(win("b", "rgb(0,0,0) 0px 0px 1px, rgb(0,0,0) 0px 0px 2px, rgb(0,0,0) 0px 0px 3px"));
};
</script></body></html>
