<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;height:2000px;background:#000}
#player-container-id{position:relative;width:100vw;height:56.25vw}
.html5-video-player{position:absolute;inset:0;overflow:hidden;background:#456}
.html5-video-container{position:absolute;inset:0;z-index:10}
.ytp-caption-window-container{position:absolute;top:0;left:0;right:0;bottom:0;pointer-events:none;width:calc(100% - 48px);margin:0 24px}
.caption-window{position:absolute;line-height:normal;z-index:41;pointer-events:auto;border:8px solid transparent}
.caption-window.ytp-caption-window-bottom{margin-bottom:16px}
.ytp-caption-segment{background:rgba(8,8,8,.75);color:#fff;font-size:16px}
#player-control-overlay{position:absolute;top:0;left:0;right:0;bottom:0;touch-action:manipulation;z-index:50}
</style></head><body>
<div id="player-container-id"><div id="movie_player" class="html5-video-player ytp-mweb-player ytp-modern-caption">
<div class="html5-video-container"><video></video></div>
<div class="ytp-caption-window-container" id="ytp-caption-window-container"></div>
</div><div id="player-control-overlay"></div></div>
<script>
window.__hits={player:0,overlay:0};
const ov=document.getElementById("player-control-overlay"), pl=document.getElementById("movie_player");
["click","touchend","pointerup","touchstart","pointerdown","mousedown","mouseup"].forEach(t=>{ov.addEventListener(t,()=>__hits.overlay++);pl.addEventListener(t,()=>__hits.player++);document.addEventListener(t,()=>{},false)});
window.ytShow=function(text){const c=document.getElementById("ytp-caption-window-container");c.innerHTML='<div class="caption-window ytp-caption-window-bottom" style="touch-action: none; text-align: center; left: 50%; bottom: 2%; transform: translateX(-50%);"><span class="captions-text"><span class="caption-visual-line"><span class="ytp-caption-segment">'+text+'</span></span></span></div>';};
</script></body></html>
